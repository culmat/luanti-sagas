schema = 1
id = "cathedral"
saga = "ruins"
title = "Ruined cathedral"
tags = ["ruin", "3td"]
lore = "Only the walls still stand. Nobody remembers whose name was sung here."

[source]
kind = "mesh"
url = "https://opengameart.org/sites/default/files/Fantasy%20Ruins%20Pack.zip"
file = "Fantasy Ruins Pack.zip"
member = "FantasyRuins_Ready/game/art/shapes/Ruins/CathedralRuins_01/CathedralRuins_01.dae"
sha256 = "12dad8708181bef31ac5e688fb61dc3232138206a6f004407044215f5fd64dfd"
author = "Ron Kapaun / 3TD Studios"
author_url = "https://opengameart.org/content/3td-fantasy-ruins-pack"
license = "CC0-1.0"
license_url = "https://opengameart.org/content/3td-fantasy-ruins-pack"
ai = "none"
notes = "3TD Fantasy Ruins Pack on OpenGameArt. Attribution not required; credit Ron Kapaun / 3TD Studios."

[transform]
up = "auto"
target_size = 44
anchor = "bottom-center"

[voxel]
mode = "shell"
exclude = ["*collision*", "*col-*", "*100*"]

[materials]
mode = "classes"
default = "stone"
context = "surroundings"

[[materials.rules]]
match = { material = "*vino*" }
class = "leaves"

[[materials.rules]]
match = { material = "*mossy*" }
class = "moss"

[[materials.rules]]
match = { material = "*debris*" }
class = "debris"

[[materials.rules]]
match = { material = "*wood*" }
class = "wood"

[[materials.rules]]
match = { material = "*floor*" }
class = "marble"

[[materials.rules]]
match = { material = "*column*" }
class = "marble"

[[materials.rules]]
match = { material = "*concrete*" }
class = "cobble"

[[materials.rules]]
match = { material = "*brick*" }
class = "stone"

[ruin]
enabled = true
debris_height = 2
moss = 0.12

[placement]
site = ["plain", "slope"]
exposure = "any"
biomes = ["grassland", "forest", "taiga", "mountain"]
rarity = 2500
hints = "Big and rare: an open, fairly flat place in temperate land. Built from the local stone."
