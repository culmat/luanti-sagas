schema = 1
id = "han_temple"
saga = "antiquity"
title = "Temple of the Han"
tags = ["0ad", "antiquity"]
lore = "Incense still lingers in the halls."

[source]
kind = "mesh"
url = "https://raw.githubusercontent.com/0ad/0ad/61a3b9507d974084e6badb88a0826bd89a6d5b8b/binaries/data/mods/public/art/meshes/structural/han_temple.dae"
file = "han_temple.dae"
sha256 = "0b564c611ce6cfee35787125807bc4eb7564c233cc697a64743a0ba53e7756e5"
extra_files = [{ url = "https://raw.githubusercontent.com/0ad/0ad/61a3b9507d974084e6badb88a0826bd89a6d5b8b/binaries/data/mods/public/art/textures/skins/structural/han_struct_02.png", file = "han_struct_02.png", sha256 = "ea99d9f7752559732d9a45ceda8eaf170d9cc795dee2ffcb4567f4f378506c76" }]
author = "Wildfire Games (0 A.D.)"
author_url = "https://play0ad.com"
license = "CC-BY-SA-3.0"
license_url = "https://github.com/0ad/0ad/blob/61a3b9507d974084e6badb88a0826bd89a6d5b8b/LICENSE.txt"
ai = "none"
notes = "0 A.D. game art: mesh art/meshes/structural/han_temple.dae, texture art/textures/skins/structural/han_struct_02.png (actor texture)."

[transform]
up = "auto"
target_size = 40
anchor = "bottom-center"

[voxel]
mode = "shell"
texture = "han_struct_02.png"
alpha = "ignore"
# The model paints its doors on the texture (sagas lint L016): on the centre line, the hall door and
# the gate in the south wall of the courtyard in front of it.
openings = [[16, 1, 29, 17, 2, 29], [16, 1, 38, 17, 2, 38]]

[materials]
mode = "classes"
default = "marble"
context = "surroundings"

[[materials.rules]]
match = { y_frac = [0.5, 1.0], normal = "up" }
class = "roof_dark"

[[materials.rules]]
match = { y_frac = [0.5, 1.0], normal = "down" }
class = "roof_dark"

[[materials.rules]]
match = { color = "#9c3a2a", tol = 24 }
class = "roof_red"

[[materials.rules]]
match = { y = [0, 3] }
class = "stone"

[[materials.rules]]
match = { color = "#6e4a2c", tol = 18 }
class = "wood"

[placement]
site = ["plain", "slope", "ridge"]
exposure = "any"
biomes = ["forest", "jungle", "mountain", "taiga", "grassland"]
rarity = 1300
hints = "Forests and mountains of the east; on a terrace or ridge."
