name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # the contribution bot starts CI on its own branches (.github/workflows/intake.yml)

permissions:
  contents: read
  pull-requests: read

jobs:
  tools:
    name: tools (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  content:
    # Contributors commit landmark.toml (and voxels when they have the tools); CI rebuilds what
    # changed, as deliver.yml does on main, then checks and pictures the result.
    name: content (lint, build, pictures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --project tools
      - name: Changed landmarks
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          git diff --name-only "$BASE"...HEAD -- content \
            | awk -F/ 'NF >= 4 { print $2 "/" $3 }' | sort -u \
            | while read -r l; do if [ -f "content/$l/landmark.toml" ]; then echo "$l"; fi; done > changed.txt
          cat changed.txt
      - name: Rebuild changed landmarks
        run: |
          touch notes.txt
          while read -r l; do
            uv run --project tools sagas fetch "$l" \
              || echo "$l: the source needs a login, so these pictures use the committed voxels" >> notes.txt
            uv run --project tools sagas voxelize "$l" --stale
          done < changed.txt
          uv run --project tools sagas build
      - name: Licences, attribution, size and value budget
        run: uv run --project tools sagas lint --strict
      - name: Core mod has the tools' vocabulary and palette
        run: uv run --project tools sagas sync-core --check
      - run: uv run --project tools sagas palette
      - name: Pictures of changed landmarks
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [ -n "$PR" ] || PR=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          mkdir -p pictures
          while read -r l; do
            n=${l/\//-}
            cp "content/$l/preview.png" "pictures/$n.png"
            uv run --project tools sagas view "$l" --no-open --png "pictures/$n-sizes.png" --out "$RUNNER_TEMP/$n.html"
          done < changed.txt
          jq -n --arg pr "${PR:-}" --arg sha "$HEAD_SHA" --rawfile landmarks changed.txt --rawfile notes notes.txt \
            '{pr: $pr, sha: $sha, landmarks: ($landmarks | split("\n") | map(select(. != ""))), notes: ($notes | split("\n") | map(select(. != "")))}' \
            > pictures/meta.json
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'push'
        with:
          name: pictures
          path: pictures/
          if-no-files-found: ignore

  pictures:
    # branches of this repository (the bot's intake/* branches, maintainers); forks get theirs from
    # pictures.yml, because their CI has no write token
    name: pictures
    needs: content
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: pictures
          path: pictures
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/post-pictures.sh pictures "$SHA"

  mods:
    name: mods
    # luacheck, ldg lint and headless runs of the modpack in every game x engine
    uses: culmat/avanti-luanti/.github/workflows/mod-ci.yml@v2
    with:
      path: mods
      games: minetest,mineclonia,mineclone2
