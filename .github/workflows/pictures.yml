# After CI on a pull request from a fork: show the pictures of its landmarks in a comment. CI posts
# them itself for branches of this repository; a fork's CI has no write token, so this workflow does
# it. It never runs pull request code: the artifact is data, checked by scripts/post-pictures.sh.
name: Pictures
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: scripts
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: pictures
          path: pictures
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish the pictures and comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
        run: scripts/post-pictures.sh pictures "$SHA" "$RESULT"
