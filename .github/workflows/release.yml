# Release the modpack by hand. Normal releases need no tag: deliver.yml releases after every merge or
# push to main (docs/releasing.md). There is one ContentDB package: the modpack in mods/.
#
# Push a tag v<version>, e.g. v2026.10.24.5. CI checks and packages it and attaches the zip to a
# GitHub release, then tags the modpack folder's tree (cdb/<pkg>/<version>) and asks ContentDB to
# import that git ref. Set up once: docs/releasing.md.
name: Release
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --project tools
      - run: uv run --project tools sagas lint --strict
      - run: uv run --project tools sagas build --check
      - name: Build the zip
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          uv run --project tools sagas package pack --version "$VERSION" --out dist
          ls -l dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true

  contentdb:
    needs: package
    runs-on: ubuntu-latest
    environment: contentdb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: culmat/avanti-luanti
          ref: main
          path: .avanti
      - name: Tag the modpack folder as its own tree and release it on ContentDB
        # ContentDB imports a git ref from the repository root; the modpack lives in mods/, so commit
        # that folder's tree on its own (parent: the release commit) and tag it cdb/<pkg>/<version>.
        env:
          CONTENTDB_TOKEN: ${{ secrets.CONTENTDB_TOKEN }}
          AVANTI_CONTENTDB_USER: ${{ vars.CONTENTDB_USER || 'culmat' }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          pkg=$(sed -n 's/^[[:space:]]*name[[:space:]]*=[[:space:]]*\([^[:space:]]*\).*/\1/p' mods/modpack.conf | head -n 1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit=$(git commit-tree "$(git rev-parse HEAD:mods)" -p HEAD -m "$pkg $VERSION: package tree of $GITHUB_SHA")
          ref="cdb/$pkg/$VERSION"
          git tag -a "$ref" "$commit" -m "$pkg $VERSION for ContentDB"
          git push origin "refs/tags/$ref"
          .avanti/plugins/avanti/bin/avanti cdb release "$ref" mods --title "$VERSION"
