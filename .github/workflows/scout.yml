# Weekly model scouting. Opens (or updates) a pull request with docs/scouting/; never merges.
# Optional secrets: SKETCHFAB_TOKEN (Sketchfab challenges anonymous scripts), SI_API_KEY (api.data.gov).
name: Scout
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --project tools
      - name: Search
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
          SI_API_KEY: ${{ secrets.SI_API_KEY }}
        run: uv run --project tools sagas scout --limit 6
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: scouting
          title: "Scouting report"
          commit-message: "Scouting report"
          body: |
            Candidates found by `sagas scout`. Licences are as reported by the sources: check the model
            page before promoting (`sagas scout promote <id> --theme <theme> --id <saga_id>`).
          add-paths: docs/scouting/
