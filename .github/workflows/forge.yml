# Saga Forge (forge/): test on three systems, and on a forge/v* tag build the six binaries and a
# GitHub release. Tags need the maintainer's approval (docs/saga-forge.md). Started by hand until
# luanthetti's pkg/ is on GitHub; then add `push: paths: [forge/**]`.
name: Saga Forge
on:
  workflow_dispatch:
  push:
    tags: ["forge/v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: culmat/luanthetti
          path: luanthetti
      - uses: actions/setup-go@v6
        with:
          go-version-file: forge/go.mod
          check-latest: true
      - name: Go workspace with luanthetti
        working-directory: forge
        run: go work init . ../luanthetti
      - name: vet and test
        working-directory: forge
        run: |
          go vet ./...
          go test -race ./...
      - name: formatted
        if: runner.os == 'Linux'
        working-directory: forge
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: setup into a temporary home (real downloads)
        working-directory: forge
        run: |
          go run ./cmd/sagaforge --home "$RUNNER_TEMP/forge-home" setup
          go run ./cmd/sagaforge --home "$RUNNER_TEMP/forge-home" doctor

  release:
    if: startsWith(github.ref, 'refs/tags/forge/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: culmat/luanthetti
          path: luanthetti
      - uses: actions/setup-go@v6
        with:
          go-version-file: forge/go.mod
      - name: Build six binaries
        working-directory: forge
        env:
          TAG: ${{ github.ref_name }}
        run: |
          go work init . ../luanthetti
          version="${TAG#forge/v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}" arch="${target#*/}" exe=sagaforge
            [ "$os" = windows ] && exe=sagaforge.exe
            dir="dist/sagaforge_${version}_${os}_${arch}"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$version" -o "$dir/$exe" ./cmd/sagaforge
            cp ../LICENSE "$dir/" 2>/dev/null || true
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$(basename "$dir").zip" "$(basename "$dir")")
            else
              tar -C dist -czf "$dir.tar.gz" "$(basename "$dir")"
            fi
          done
          (cd dist && sha256sum ./*.tar.gz ./*.zip | sed 's# \./# #' > SHA256SUMS)
      - name: GitHub release
        working-directory: forge
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "Saga Forge ${TAG#forge/v}" --notes "Install and first start: docs/saga-forge.md" --latest=false
